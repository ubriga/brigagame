# TEST environment - separate worker + separate D1. Live config untouched.
name = "brigagame-test"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[d1_databases]]
binding = "DB"
database_name = "brigagame-test"
database_id = "6deaf2d8-827d-4e82-88c4-50ea5236d865"

[vars]
FRONTEND_ORIGIN = "https://brigagame-test.ubriga.workers.dev"
SERVER_VERSION = "40"
ADMIN_EMAIL = "ubriga@gmail.com"
ALLOWED_ORIGINS = "https://brigagame-test.ubriga.workers.dev"
